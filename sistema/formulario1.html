<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cadastro do ator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: black;
        }

        .formulario {
            width: 700px;
            margin: 30px auto;
            background-color:black;
            padding: 25px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        h1 {
            text-align: center;
            background-color: white;
            font-size: 22px;
        }

        fieldset {
            margin-bottom: 15px;
            padding: 15px;
        }

        legend {
            font-weight: bold;
        }

        .campo {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .campo div {
            flex: 1;
        }

        label {
            display: block;
            background-color: white;
            margin-bottom: 4px;
            font-size: 14px;
        }

        input, select, textarea {
            width: 100%;
            padding: 7px;
            box-sizing: border-box;
        }

        textarea {
            height: 70px;
            resize: none;
        }

        .botoes {
            text-align: right;
        }

        button {
            padding: 8px 15px;
          
            cursor: pointer;
        }

        .salvar {
            background-color:blue;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

<div class="formulario">

    <h1>FICHA DE CADASTRO DO ATOR</h1>

    <form>

        <!-- DADOS PESSOAIS -->
        <fieldset>
            <legend>Dados Pessoais</legend>

            <div class="campo">
                <div>
                    <label>Nome Completo:</label>
                    <input type="text" name="nome">
                </div>

                <div>
                    <label>Sexo:</label>
                    <select name="sexo">
                        <option value="">Selecione</option>
                        <option>Masculino</option>
                        <option>Feminino</option>
                    </select>
                </div>
            </div>

            <div class="campo">
                <div>
                    <label>Data de Nascimento:</label>
                    <input type="date" name="nascimento">
                </div>

                <div>
                    <label>CPF:</label>
                    <input type="text" name="cpf">
                </div>

                <div>
                    <label>RG:</label>
                    <input type="text" name="rg">
                </div>
            </div>

            <div class="campo">
                <div>
                    <label>Nacionalidade:</label>
                    <input type="text" name="nacionalidade" value="Brasileira">
                </div>

                <div>
                    <label>E-mail:</label>
                    <input type="email" name="email">
                </div>
            </div>

            <div class="campo">
                <div>
                    <label>Telefone Celular:</label>
                    <input type="tel" name="celular">
                </div>

                <div>
                    <label>Telefone Residencial:</label>
                    <input type="tel" name="telefone">
                </div>
            </div>
        </fieldset>


        <!-- DADOS DE ENDEREÇO -->
        <fieldset>
            <legend>Dados de Endereço</legend>

            <div class="campo">
                <div>
                    <label>CEP:</label>
                    <input type="text" name="cep">
                </div>

                <div style="flex: 3;">
                    <label>Logradouro:</label>
                    <input type="text" name="logradouro">
                </div>

                <div>
                    <label>Número:</label>
                    <input type="text" name="numero">
                </div>
            </div>

            <div class="campo">
                <div>
                    <label>Complemento:</label>
                    <input type="text" name="complemento">
                </div>

                <div>
                    <label>Bairro:</label>
                    <input type="text" name="bairro">
                </div>

                <div>
                    <label>Cidade:</label>
                    <input type="text" name="cidade">
                </div>

                <div>
                    <label>Estado:</label>
                    <select name="estado">
                        <option>SP</option>
                        <option>PR</option>
                        <option>SC</option>
                        <option>RJ</option>
                        <option>MG</option>
                    </select>
                </div>
            </div>
        </fieldset>


        <!-- DADOS ACADÊMICOS -->
        <fieldset>
            <legend>Dados Acadêmicos</legend>

            <div class="campo">
                <div>
                    <label>Curso:</label>
                    <input type="text" name="curso">
                </div>

                <div>
                    <label>Matrícula:</label>
                    <input type="text" name="matricula">
                </div>
            </div>

            <div class="campo">
                <div>
                    <label>Ano/Semestre de Ingresso:</label>
                    <input type="text" name="ingresso">
                </div>

                <div>
                    <label>Escolaridade Anterior:</label>
                    <select name="escolaridade">
                        <option>Ensino Médio Completo</option>
                        <option>Ensino Médio Incompleto</option>
                        <option>Ensino Superior</option>
                    </select>
                </div>
            </div>

            <div class="campo">
                <div>
                    <label>Período:</label>
                    <select name="periodo">
                        <option>integral</option>
                        <option>manhã</option>
                        <option>noite</option>
                    </select>
                </div>

                <div>
                    <label>Turma:</label>
                    <input type="text" name="turma">
                </div>
            </div>
        </fieldset>


        <!-- RESPONSÁVEL -->
        <fieldset>
            <legend>Dados do Responsável</legend>

            <div class="campo">
                <div>
                    <label>Nome do Responsável:</label>
                    <input type="text" name="responsavel">
                </div>

                <div>
                    <label>CPF do Responsável:</label>
                    <input type="text" name="cpf_responsavel">
                </div>
            </div>

            <label>Observações:</label>
            <textarea name="observacoes"></textarea>
        </fieldset>



    </form>

</div>

</body>
</html>
